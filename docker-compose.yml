version: '3.8'

services:
  telegram-bot:
    build: .
    container_name: receipt-scanner-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_PATH=/app/data/receipts.db
      - LOG_LEVEL=INFO
      - LOG_FILE=/app/logs/bot.log
      - TEMP_DIR=/app/temp
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./temp:/app/temp
    env_file:
      - .env
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge